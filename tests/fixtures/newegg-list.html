<!doctype html>
<!-- Made-up data in the structure of Newegg's order history. Not captured from a real account. -->
<html><head><title>Newegg.com Order History</title></head><body>
<div class="list-tools-bar"><select id="date"><option value="-1">Recent Orders</option><option value="30">30 Days</option><option value="120">120 Days</option><option value="2024">Year 2024</option><option value="2018">Year 2018</option></select></div>
<div class="order-list">
  <div class="order">
    <div class="order-section order-head">
      <div class="order-left">
        <div class="order-item"><div class="order-item-tag">Order Date:</div><strong class="order-item-info">03/15/2024</strong></div>
        <a class="btn" href="https://secure.newegg.com/orders/cart?CartID=AAA">Order Details / Invoice</a>
      </div>
      <div class="order-right"><div class="order-item order-head-total"><label class="order-item-tag">Order Total:</label><span class="order-item-info"><span class="price-current">$<strong>1,234</strong><sup>.50</sup></span></span></div></div>
    </div>
    <div class="order-body">
      <div class="order-section"><div class="order-left"><div class="order-item"><label class="order-item-tag">Order #</label><strong class="order-item-info">111222333</strong></div></div></div>
      <div class="order-tracking"><div class="order-item"><a class="order-message-note">Delivered</a><div class="article"><p>All item(s) have been delivered.</p></div></div></div>
      <div class="item-cells-wrap">
        <div class="item-cell"><div class="item-container">
          <a class="item-img" href="https://www.newegg.com/widget/p/N1"><img alt=""></a>
          <div class="item-info"><a class="item-title" href="https://www.newegg.com/widget/p/N1">Test Graphics Card 16GB</a>
            <div class="item-note"><span><span>Sold &amp; Shipped by</span> <a class="link-text" href="https://www.newegg.com/Seller-Store/x">Example Seller</a></span></div></div>
          <div class="item-qty">2</div>
        </div></div>
      </div>
    </div>
  </div>
</div>
</body></html>
